services:
  # Центральный пайплайн заказов
  App\Service\Order\OrderProcessorPipeline:
    arguments:
      $processors: !tagged_iterator order.processor

  # Автоматически регистрируем все процессоры
  App\Service\Order\OrderProcessor\:
    resource: '../../src/Service/Order/OrderProcessor/*'
    tags: ['order.processor']

  # Приоритеты процессоров
  App\Service\Order\OrderProcessor\OrderQuantityModifyProcessor:
    tags: [{ name: 'order.processor', priority: 300 }]
  App\Service\Order\OrderProcessor\OrderDiscountProcessor:
    tags: [{ name: 'order.processor', priority: 250 }]
  App\Service\Order\OrderProcessor\OrderTaxCalculateProcessor:
    tags: [{ name: 'order.processor', priority: 200 }]
  App\Service\Order\OrderProcessor\OrderSubtotalCalculateProcessor:
    tags: [{ name: 'order.processor', priority: 150 }]
  App\Service\Order\OrderProcessor\OrderTotalCalculateProcessor:
    tags: [{ name: 'order.processor', priority: 100 }]
  App\Service\Order\OrderProcessor\OrderPaymentProcessor:
    tags: [{ name: 'order.processor', priority: 50 }]
  App\Service\Order\OrderProcessor\OrderStatusProcessor:
    tags: [{ name: 'order.processor', priority: 10 }]

  # Discount rules
  App\Service\Order\OrderDiscount\OrderDiscountRule\:
    resource: '../../src/Service/Order/OrderDiscount/OrderDiscountRule/*'
    tags: ['order.discount_rule']

  # Валидаторы оплаты и доставки
  App\Service\Order\OrderPayment\OrderPaymentMethodChecker:
    tags: ['order.payment_checker']

  App\Service\Order\OrderShipment\OrderShipmentMethodChecker:
    tags: ['order.shipment_checker']

  # Сервис для работы сессий заказа
  App\Service\Order\OrderSession\:
    resource: '../../src/Service/Order/OrderSession/*'
    autowire: true
    autoconfigure: true

  # Калькуляторы, менеджеры и вспомогательные сервисы
  App\Service\Order\OrderCalculator: ~
  App\Service\Order\OrderSubtotalCalculator: ~
  App\Service\Order\OrderManager: ~
  App\Service\Order\OrderService: ~
  App\Service\Order\OrderEmailManager: ~
  App\Service\Order\OrderExpiredRemover: ~
  App\Service\Order\OrderItemQuantityModifier: ~
  App\Service\Order\OrderItemQuantityDataMapper: ~
  App\Service\Order\OrderNumberAssigner: ~
  App\Service\Order\CustomerIpOrderAssigner: ~
  App\Service\Order\OrderStateMachine: ~
  App\Service\Order\OrderStatusTransitionGuard: ~
