name: CI - Tests & Analysis (with Alerts)
on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { php: ['8.2','8.3'] }
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: { php-version: ${{ matrix.php }}, extensions: amqp, intl, pdo_pgsql, tools: composer:v2 }
      - name: Install deps
        run: composer install --no-interaction --no-progress
      - name: Run tests & analysis
        run: |
          set -o pipefail
          {
            vendor/bin/phpstan analyse --memory-limit=1G --configuration=phpstan.neon
            vendor/bin/psalm --show-info=false --output-format=compact
            vendor/bin/rector process --dry-run --config=rector.neon
            vendor/bin/php-cs-fixer fix --dry-run --diff
            vendor/bin/phpunit --testdox --colors=always
            php bin/console doctrine:schema:validate --skip-sync
          } | tee "$GITHUB_WORKSPACE/job.log"
      - name: Notify on failure (Slack/Telegram + Metrics)
        if: failure()
        env:
          CI_FAILURE_EMOJI: "💥"
          CI_FAILURE_TYPE: "tests"
        run: |
          ./notifiers/slack_notify.sh "Tests/Analysis failed on PHP ${{ matrix.php }} — ${{ github.repository }}"
          ./notifiers/telegram_notify.sh "Tests/Analysis failed on PHP ${{ matrix.php }} — ${{ github.repository }}"
          python monitoring/ci_failure_exporter.py "$CI_FAILURE_TYPE"
