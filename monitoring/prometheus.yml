global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'ordercomponent_app'
    static_configs: [{ targets: ['app:9100'] }]
  - job_name: 'ci_failures'
    static_configs: [{ targets: ['ci-exporter:9105'] }]
  - job_name: 'ci_metrics'
    static_configs: [{ targets: ['ci-exporter:9106'] }]
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs: [{ targets: ['pushgateway:9091'] }]
