apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-worker
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: order-worker
  endpoints:
    - port: http
      interval: 15s
      path: /metrics
  namespaceSelector:
    matchNames: ["order-staging","order-prod"]
