apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: order-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: order.availability
      rules:
        - alert: OrderAppPodUnavailable
          expr: kube_deployment_status_replicas_unavailable{deployment="order-app"} > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Order app has unavailable replicas"
            description: "Deployment order-app has unavailable replicas for more than 5 minutes."
        - alert: OrderWorkerPodUnavailable
          expr: kube_deployment_status_replicas_unavailable{deployment="order-worker"} > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Order worker has unavailable replicas"
            description: "Deployment order-worker has unavailable replicas for more than 5 minutes."
    - name: order.scaling
      rules:
        - alert: HPAAtCapacityOrderApp
          expr: (kube_hpa_status_current_replicas{hpa="order-app-hpa"} / kube_hpa_spec_max_replicas{hpa="order-app-hpa"}) >= 0.9
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Order app HPA near max capacity"
            description: "HPA for order-app is at ≥90% of max replicas for 10m."
        - alert: HPAAtCapacityOrderWorker
          expr: (kube_hpa_status_current_replicas{hpa="order-worker-hpa"} / kube_hpa_spec_max_replicas{hpa="order-worker-hpa"}) >= 0.9
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Order worker HPA near max capacity"
            description: "HPA for order-worker is at ≥90% of max replicas for 10m."
    - name: order.resources
      rules:
        - alert: HighCPUOrderApp
          expr: sum(rate(container_cpu_usage_seconds_total{pod=~"order-app-.*",container!="POD"}[5m])) by (pod) > 0.8
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "High CPU usage on order-app pods"
            description: "CPU usage > 0.8 cores for 10m."
        - alert: HighMemoryOrderApp
          expr: (container_memory_working_set_bytes{pod=~"order-app-.*",container!="POD"}) > 800000000
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "High memory usage on order-app pods"
            description: "Working set > ~800MiB for 10m."
    - name: order.errors
      rules:
        - alert: HighHTTP5xxRate
          expr: |
            sum(rate(http_requests_total{status=~"5..",app=~"order-app|order-worker"}[5m]))
            / clamp_min(sum(rate(http_requests_total{app=~"order-app|order-worker"}[5m])), 1) > 0.05
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "HTTP 5xx ratio > 5%"
            description: "More than 5% of requests are 5xx for 10m."
