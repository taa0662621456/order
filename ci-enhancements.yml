name: OrderComponent CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: xdebug
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate
        run: composer validate --no-check-publish
      - name: Static analysis
        run: |
          if [ -f vendor/bin/phpstan ]; then vendor/bin/phpstan analyse --memory-limit=1G || true; fi
          if [ -f vendor/bin/psalm ]; then vendor/bin/psalm --no-cache || true; fi
          if [ -f vendor/bin/rector ]; then vendor/bin/rector process --dry-run || true; fi
      - name: Tests
        run: |
          if [ -f vendor/bin/phpunit ]; then vendor/bin/phpunit --testdox; fi
      - name: Pack artifact
        run: zip -r OrderComponent-beta-build.zip . -x "vendor/*"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderComponent-beta-${{ matrix.php }}
          path: OrderComponent-beta-build.zip
