{{- if .Values.app.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ordercomponent }
spec:
  rules:
    - host: {{ .Values.app.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ordercomponent-svc
                port: { number: {{ .Values.service.port }} }
  {{- if .Values.app.ingress.tls.enabled }}
  tls:
    - hosts: [ {{ .Values.app.ingress.host }} ]
      secretName: {{ .Values.app.ingress.tls.secretName }}
  {{- end }}
{{- end }}
