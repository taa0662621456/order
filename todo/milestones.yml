# Roadmap milestones for Order Component (α)
milestones:
  - title: "α-1 Domain Layer stabilized"
    description: "Entities / Value Objects / Repositories / Domain Events"
    labels: ["domain", "entity", "vo", "repository", "event"]
    due_on: null
    checklist:
      - "Define Aggregates: Order, OrderItem, OrderPayment, OrderShipment"
      - "Implement VO: Money, Currency, Taxation, Discount, Quantity, Sku"
      - "Create Repositories and specs"
      - "Domain Events emitted on state changes"
  - title: "α-2 Transactional App Layer"
    description: "Handlers / Bus / Outbox / Idempotency"
    labels: ["app", "messenger", "outbox", "idempotency"]
    due_on: null
    checklist:
      - "Commands & Handlers wired to Messenger"
      - "Transactional boundary + rollback"
      - "Outbox write & consumer process"
      - "Idempotency keys enforced"
  - title: "α-3 Pricing & Tax Engine"
    description: "Promotion & Tax strategies + config"
    labels: ["pricing", "tax", "config"]
    due_on: null
    checklist:
      - "Pricing engine (base/discount/tax/shipping/fees)"
      - "PromotionStrategyInterface, TaxationStrategyInterface"
      - "Currency conversion & rounding policies"
  - title: "α-4 Payment & Shipment modules"
    description: "Gateways/Webhooks/Refunds + Carriers/Tracking"
    labels: ["payment", "shipment", "integration"]
    due_on: null
    checklist:
      - "Payment interfaces + adapters"
      - "Webhook listeners to OrderPaidEvent"
      - "Refund API"
      - "Carrier strategy + tracking updates"
  - title: "α-5 QA / CI/CD / Docs"
    description: "Tests + CI + Docs + tag v0.1.0-alpha"
    labels: ["qa", "ci", "docs"]
    due_on: null
    checklist:
      - "Unit≥90%, Integration≥80%"
      - "Static analysis gates (PHPStan/Psalm)"
      - "GitHub Actions + artifacts"
      - "Docs: README, OpenAPI, OrderSandboxApp"
