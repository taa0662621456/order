apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config }
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
    scrape_configs:
      - job_name: 'ordercomponent_app'
        static_configs: [{ targets: ['app:9100'] }]
      - job_name: 'ci_failures'
        static_configs: [{ targets: ['ci-exporters:9105'] }]
      - job_name: 'ci_metrics'
        static_configs: [{ targets: ['ci-exporters:9106'] }]
      - job_name: 'pushgateway'
        static_configs: [{ targets: ['pushgateway:9091'] }]
