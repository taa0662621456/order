metrics:
  path: /metrics
  controller: OrderComponent\Infrastructure\Monitoring\MetricsController
  methods: [GET]

order_health:
  path: /_health/order
  controller: OrderComponent\Infrastructure\Monitoring\HealthController::liveness
  methods: [GET]

order_ready:
  path: /_ready/order
  controller: OrderComponent\Infrastructure\Monitoring\HealthController::readiness
  methods: [GET]
