[supervisord]
nodaemon=true

[program:messenger]
command=php /var/www/html/bin/console messenger:consume async -vv --time-limit=0 --memory-limit=512M
autostart=true
autorestart=true

[program:outbox-replay]
command=sh -c 'while true; do php /var/www/html/bin/console order:outbox:replay 100; sleep 3600; done'
autostart=true
autorestart=true
