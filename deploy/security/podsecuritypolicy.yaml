apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: order-psp-restricted
spec:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser:
    rule: MustRunAs
    ranges: [ { min: 1000, max: 1000 } ]
  fsGroup:
    rule: MustRunAs
    ranges: [ { min: 1000, max: 1000 } ]
  supplementalGroups:
    rule: MustRunAs
    ranges: [ { min: 1000, max: 1000 } ]
  volumes: [ 'configMap','secret','emptyDir','projected' ]
